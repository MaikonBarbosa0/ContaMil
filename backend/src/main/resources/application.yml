spring:
  application:
    name: contamil
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contamil}
    username: ${DB_USERNAME:contamil}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
contamil:
  time-zone: ${CONTAMIL_TIME_ZONE:America/Sao_Paulo}
